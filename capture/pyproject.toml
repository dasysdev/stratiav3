[project]
name = "capture"
version = "0.1.0"
description = "stratia.cic: motor de captura (Chrome real por CDP, legitimidad, ritmo de lector) y almacén común de fichas congeladas"
requires-python = ">=3.13"
dependencies = [
    "websockets>=13.1,<16",
]

[tool.uv]
# Not a distributable package: the code runs from src/ with PYTHONPATH (see env/docker/app/Dockerfile)
package = false
