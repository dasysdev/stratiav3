# uv workspace of stratia.cic: one member per system (a top-level directory) and a single
# uv.lock. The root is virtual: it only holds the members, the dev tools and pytest.
[tool.uv.workspace]
members = ["capture", "demand-engine", "info-audit", "references", "web-audit"]

[dependency-groups]
dev = [
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["capture/tests", "demand-engine/tests", "info-audit/tests", "references/tests", "web-audit/tests"]
# Test files of different modules may share a basename
addopts = "--import-mode=importlib"
markers = ["chrome: needs Google Chrome (runs inside the container)"]
